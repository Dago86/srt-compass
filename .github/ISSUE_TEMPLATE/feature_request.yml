name: Feature request
description: Propose an improvement and describe the problem it solves.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which situation should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: costs
    attributes:
      label: Cost and data impact
      description: State whether this requires new APIs, data transfers or downloads.
