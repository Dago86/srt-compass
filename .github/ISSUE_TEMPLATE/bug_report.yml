name: Bug report
description: Report reproducible behavior without including private data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include API keys, signed URLs, subtitles, videos or unfiltered logs.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.13.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use invented names and content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed keys, personal data and protected content.
          required: true
