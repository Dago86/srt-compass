name: Verify macOS builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[packaging]'
      - run: MAC_ARCH=${{ matrix.arch }} ./build-mac-app.sh
      - run: shasum -a 256 "dist/SRT Compass 0.15.0 macos-${{ matrix.arch }}.dmg"
