name: Verify macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[packaging]'
      - run: ./scripts/prepare-vendor-macos.sh
      - run: ./build-mac-app.sh
      - run: shasum -a 256 'dist/SRT Compass 0.13.0.dmg'
