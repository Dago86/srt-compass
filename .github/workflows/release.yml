name: Build and publish release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[packaging]'
      - run: VERSION="${GITHUB_REF_NAME#v}" MAC_ARCH=${{ matrix.arch }} ./build-mac-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-tk unzip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[packaging]'
      - run: ./scripts/prepare-vendor-linux.sh
      - run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo install /tmp/appimagetool /usr/local/bin/appimagetool
      - run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-linux-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.AppImage

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "SRT Compass $GITHUB_REF_NAME"
