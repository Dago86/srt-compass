name: Verify Linux AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-tk unzip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[packaging]'
      - run: ./scripts/prepare-vendor-linux.sh
      - run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo install /tmp/appimagetool /usr/local/bin/appimagetool
      - run: ./scripts/build-linux-appimage.sh
      - run: sha256sum "dist/SRT Compass 0.15.0 linux-x86_64.AppImage"
